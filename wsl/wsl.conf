# wsl.conf — configuração POR DISTRO, vai para /etc/wsl.conf DENTRO do Ubuntu.
# Uso:  sudo cp wsl.conf /etc/wsl.conf   (ou deixe o cloud-init escrever no 1o boot)
#       O provision.sh instala este arquivo sozinho, trocando o `default` pelo
#       seu usuário real — prefira rodar ele a copiar na mão.
# Seguro sobrescrever quantas vezes quiser (idempotente).
#
# NÃO confundir com o .wslconfig (mora em %USERPROFILE%\.wslconfig, no lado
# Windows, e configura a VM inteira: memória, CPU, VHD). Esse outro arquivo
# vive em profile/wslconfig neste repo.
#
# ⚠️ REGRA DOS 8 SEGUNDOS: mudança aqui (ou no .wslconfig) só vale depois que a
# VM do WSL para de vez — o que acontece ~8 s DEPOIS de fechar a última shell.
# Escreveu, rode `wsl --shutdown` no Windows antes de conferir, senão você
# testa o estado velho e conclui que "não funcionou".

[boot]
# systemd de verdade dentro da distro. Sem isso, `systemctl` não funciona e
# serviços empacotados (docker engine, tailscaled, postgres) não sobem sozinhos.
systemd = true

[user]
# Usuário padrão ao abrir a distro. Tem que ser um usuário que EXISTE — se
# apontar para um nome inexistente a distro não abre e você precisa de
# `wsl -d Ubuntu-24.04 -u root` para consertar.
# ⚠️ Se trocar `dev` por outro nome, troque também no cloud-init.user-data.
default = dev

# Deliberadamente minimalista: só o que o plano especifica. Cada seção extra
# ([automount], [network], [interop]) é mais uma coisa para depurar numa
# máquina recém-formatada, e os defaults do WSL2 já servem para este uso.
